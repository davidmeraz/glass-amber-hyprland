# ═══════════════════════════════════════════════════════════════
#  HYPRLAND CONFIG 0.54.3 - POP!_OS (NVIDIA + RYZEN 5800X)
# ═══════════════════════════════════════════════════════════════

# ── 1. DEFINICIÓN DE VARIABLES (DEBE IR PRIMERO) ──────────────
$mainMod = SUPER

# ── 2. PARCHE DE EMERGENCIA PARA CTRL+C ──────────────────────
# Primero anulamos cualquier bind previo y luego forzamos que no haga nada
unbind = CONTROL, C
unbind = CONTROL_L, C
bind = CONTROL, C, pass, ^(kitty)$ # Pasa el comando directamente a la terminal

# ── 3. MONITORES ──────────────────────────────────────────────
monitor=,1920x1080@165,auto,1

# ── 4. VARIABLES DE ENTORNO NVIDIA ────────────────────────────
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = NVD_BACKEND,direct

# ── THEME / CURSOR ────────────────────────────────────────────
env = XCURSOR_THEME,breeze-dark
env = XCURSOR_SIZE,24
env = GTK_THEME,adw-gtk3-dark

bindn = , Control_L, pass, ^(kitty)$
bindn = , Alt_L, pass, ^(kitty)$


# ── 5. AUTOSTART ──────────────────────────────────────────────
exec-once = swww-daemon
# exec-once = waybar
exec-once = dunst
exec-once = nm-applet --indicator
exec-once = /usr/bin/lxqt-policykit-agent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

exec-once = /home/dav3e/Proyectos/zsh/dynamic-island/island.zsh start
# ── WIDGETS DE ESCRITORIO (Workspace 1) ───────────────────────
exec-once = ~/.config/hypr/scripts/dashboard.sh

# ── 6. INPUT ──────────────────────────────────────────────────
input {
    kb_layout = latam
    follow_mouse = 1
    sensitivity = 0
    force_no_accel = true
}

# ── 7. APARIENCIA ─────────────────────────────────────────────
general {
    gaps_in = 6
    gaps_out = 70, 15, 15, 15  # 70px top, 15px para los demás bordes
    border_size = 1
    col.active_border = rgb(C9A84C) rgb(8B6F2D) 45deg
    col.inactive_border = rgba(C9A84C77)
}

decoration {
    rounding = 10             # Bordes redondeados

    active_opacity = 0.9
    inactive_opacity = 0.8
    fullscreen_opacity = 1.0
    
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    
    blur {
        enabled = true
        size = 3
        passes = 1
	vibrancy =  0.1696
    }
}

# ── 8. ANIMACIONES ────────────────────────────────────────────

animations {
    enabled = true

    # Definir una curva (puedes probar en cssportal.com/css-cubic-bezier-generator/)
    bezier = miCurva, 0.05, 0.9, 0.1, 1.05
    bezier = borderAnim, 0.39, 0.575, 0.565, 1

    # nombre_animacion, encendido, velocidad, curva, estilo
    animation = windows, 1, 7, miCurva
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 45, borderAnim, loop
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# ── 9. CONFIGURACIÓN NVIDIA & MISC ────────────────────────────
cursor {
    no_hardware_cursors = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = true
    vrr = 1
}

# ── 10. ATAJOS DE TECLADO ─────────────────────────────────────

# Aplicaciones principales
bind = $mainMod, Return, exec, kitty
bind = $mainMod SHIFT, Return, exec, [float;size 350 220;move center;pin] kitty --title "miniterm" zsh -c "source ~/.zshrc 2>/dev/null; clear; echo -n $'\e[38;2;201;168;76m◈ \e[0m'; read cmd; eval \"\$cmd\"; sleep 1.5"
bind = $mainMod, T, exec, kitty
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod SHIFT, D, exec, ~/.config/hypr/scripts/dashboard.sh toggle # Alternar Dashboard
bind = $mainMod, E, exec, thunar
bind = $mainMod, G, exec, google-chrome

# Gestión de ventanas
bind = $mainMod, Q, killactive,        # CERRAR VENTANA
bind = $mainMod, M, exec, ~/.config/rofi/powermenu.sh  # MENÚ DE ENERGÍA (SUPER + M)
bind = $mainMod, F, fullscreen, 1      # PANTALLA COMPLETA
bind = $mainMod, V, togglefloating
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, P, exec, sh -c 'grim -g "$(slurp)" - | tee /home/dav3e/Imágenes/Capturas/Captura-$(date +%Y%m%d_%H%M%S).png | wl-copy'
bind = $mainMod, W, focuswindow, title:terminal  # ENFOCAR TERMINAL DEL DASHBOARD

# Navegación (Flechas y Vim)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Workspaces (1-6)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

# Mover ventanas a Workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

# Multimedia
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── REGLAS DE WIDGETS ─────────────────────────────────────────

# layerrule = blur, island-bar
# layerrule = ignorealpha 0.5, island-bar
# layerrule = blur, dynamic-island
# layerrule = ignorealpha 0.5, dynamic-island

# Borde dorado para todas las terminales Kitty
windowrule = match:class ^(kitty)$, border_size 1
windowrule = match:class ^(kitty)$, border_color rgb(C9A84C)

# Reglas de Estilo para Widgets (Workspace 1) — Amber Glass HUD
$widgets = ^(map|donut|lyrics|launchpad|system_info|audio_circle|game_life|terminal|visualizer|adn)$
windowrule = match:title $widgets, float 1
windowrule = match:title $widgets, border_size 1
windowrule = match:title $widgets, border_color rgba(FFD700EE) rgba(E8A317CC) rgba(C9A84CAA) 45deg
windowrule = match:title $widgets, rounding 12
windowrule = match:title $widgets, opacity 0.9 0.9
windowrule = match:title $widgets, animation popin 70%

# --- LAYOUT ASIMÉTRICO HUD PRO (Base: 1920x1080 | Gap: 20px) ---
# Nota: Los tamaños (size) y posiciones (move) de todas las ventanas del dashboard 
# ahora son controlados dinámicamente por ~/.config/hypr/scripts/dashboard.sh
# Aquí solo mantenemos las reglas de foco.

# Todas las terminales del dashboard son interactivas


