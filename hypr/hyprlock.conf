# ═══════════════════════════════════════════════════════════
#  HYPRLOCK — Amber Glass MC20 Lock Screen
#  Minimal, elegant, golden accents
# ═══════════════════════════════════════════════════════════

background {
    monitor =
    color = rgb(30, 26, 20)
}

# ── Reloj ─────────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = rgba(201, 168, 76, 1.0)
    font_size = 72
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ── Fecha ─────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:3600000] date +"%A, %d de %B"
    color = rgba(234, 234, 234, 0.8)
    font_size = 16
    font_family = JetBrains Mono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

# ── Saludo ────────────────────────────────────────────────
label {
    monitor =
    text = ◈  $USER
    color = rgba(201, 168, 76, 0.7)
    font_size = 14
    font_family = JetBrains Mono Nerd Font
    position = 0, -30
    halign = center
    valign = center
}

# ── Campo de contraseña ───────────────────────────────────
input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(201, 168, 76, 0.5)
    inner_color = rgba(10, 10, 8, 0.85)
    font_color = rgb(234, 234, 234)
    fade_on_empty = true
    placeholder_text = <i><span foreground="##777777">Contraseña...</span></i>
    hide_input = false
    rounding = 12
    check_color = rgb(201, 168, 76)
    fail_color = rgb(196, 91, 79)
    fail_text = <i>Incorrecto</i>
    fail_transition = 200
    position = 0, -80
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.4)
}
