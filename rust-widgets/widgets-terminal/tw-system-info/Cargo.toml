[package]
name = "tw-system-info"
version = "0.1.0"
edition = "2021"
authors = ["dav3e"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.32"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
macroquad = "0.4.14"
